services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: absence-conge-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: absence_conge
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    command: sh -c "php artisan migrate --force && apache2-foreground"

  db:
    image: postgres:16-alpine
    container_name: absence-conge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: absence_conge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d absence_conge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
